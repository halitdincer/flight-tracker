---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: flight-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: db-migrate
          image: ghcr.io/halitdincer/flight-tracker-api:latest
          imagePullPolicy: Always
          command: ["bundle", "exec", "rails", "db:migrate"]
          envFrom:
            - secretRef:
                name: api-secret
            - configMapRef:
                name: api-config
      containers:
        - name: api
          image: ghcr.io/halitdincer/flight-tracker-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: api-secret
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: flight-tracker
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: flight-tracker
data:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  REDIS_URL: redis://redis:6379/0
